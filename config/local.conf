[[local|localrc]]
# Ganti <password> dengan password sendiri (hanya huruf dan angka)
ADMIN_PASSWORD=<password>
DATABASE_PASSWORD=$ADMIN_PASSWORD
RABBIT_PASSWORD=$ADMIN_PASSWORD
SERVICE_PASSWORD=$ADMIN_PASSWORD

# IP VM DevStack
HOST_IP=192.168.23.160

LOGFILE=$DEST/logs/stack.sh.log
LOG_COLOR=False

# Hemat resource untuk RAM 4 GB
disable_service tempest
disable_service c-api c-sch c-vol
disable_service memory_tracker
disable_service file_tracker
